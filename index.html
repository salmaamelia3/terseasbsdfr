
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unique GitHub Button</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #0d1117;
    color: white;
}

.container {
    text-align: center;
    padding: 25px;
}

h1 {
    font-size: clamp(25px, 5vw, 38px);
    margin-bottom: 12px;
    letter-spacing: -1px;
}

.subtitle {
    color: #8b949e;
    margin-bottom: 35px;
    font-size: 15px;
}

.github-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 17px 32px;
    border: 1px solid #3fb950;
    border-radius: 14px;
    background: linear-gradient(135deg, #238636, #2ea043);
    color: #fff;
    text-decoration: none;
    font-size: 18px;
    font-weight: 700;
    overflow: hidden;
    isolation: isolate;
    box-shadow: 0 0 20px rgba(46, 160, 67, .18);
    transition: transform .3s ease,
                box-shadow .3s ease,
                border-color .3s ease;
}

.github-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 70%;
    height: 100%;
    background: linear-gradient(
        110deg,
        transparent,
        rgba(255,255,255,.3),
        transparent
    );
    transform: skewX(-20deg);
    transition: left .6s ease;
    z-index: -1;
}

.github-btn:hover {
    transform: translateY(-5px) scale(1.03);
    box-shadow: 0 0 15px rgba(63,185,80,.5),
                0 10px 35px rgba(46,160,67,.2);
    border-color: #7ee787;
}

.github-btn:hover::before {
    left: 150%;
}

.github-btn:active {
    transform: scale(.97);
}

.github-icon {
    width: 28px;
    height: 28px;
    fill: currentColor;
    flex-shrink: 0;
}

.arrow {
    font-size: 22px;
    transition: transform .3s ease;
}

.github-btn:hover .arrow {
    transform: translateX(5px);
}

.footer {
    margin-top: 25px;
    color: #6e7681;
    font-size: 12px;
}

@media (max-width: 480px) {
    .github-btn {
        padding: 15px 23px;
        font-size: 16px;
        gap: 9px;
    }

    .github-icon {
        width: 24px;
        height: 24px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Ready to Explore? 🚀</h1>
    <p class="subtitle">
        One click away from something awesome.
    </p>

    <a
      href="https://t.co/h4zemwCH2w"
      target="_blank"
      rel="noopener noreferrer"
      class="github-btn"
    >
        <svg class="github-icon"
             viewBox="0 0 24 24"
             aria-hidden="true">
            <path d="M12 .9a11.1 11.1 0 0 0-3.51
            21.63c.55.1.76-.24.76-.54v-2.1c-3.1.67
            -3.76-1.32-3.76-1.32-.5-1.3-1.24-1.64
            -1.24-1.64-1.02-.7.08-.69.08-.69
            1.13.08 1.72 1.16 1.72 1.16
            1 .1.7 2.02 2.96 1.44.1-.72.4-1.2
            .72-1.48-2.47-.28-5.06-1.24-5.06
            -5.5 0-1.22.43-2.2 1.15-2.98
            -.12-.28-.5-1.42.1-2.95 0 0
            .94-.3 3.05 1.14a10.6 10.6 0 0 1
            5.55 0c2.12-1.44 3.05-1.14
            3.05-1.14.61 1.53.23 2.67.11
            2.95.72.78 1.15 1.76 1.15 2.98
            0 4.27-2.6 5.22-5.08 5.5.4.35
            .76 1.03.76 2.08v3.09c0 .3.2.65.77.54
            A11.1 11.1 0 0 0 12 .9Z"/>
        </svg>

        <span>Explore GitHub</span>
        <span class="arrow">→</span>
    </a>

    <p class="footer">
        Built for creators & developers ✨
    </p>

</div>

</body>
</html>
